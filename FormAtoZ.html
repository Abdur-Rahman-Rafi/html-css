<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" mthod="post">
    <h1 style="text-align: center;">Sign Up Form</h1>
    <hr>
    <br>
    <label for="user">Name :</label>
    <input type="text" id="user"name="usr" placeholder="User Name">
    <br><br>
    <label for="email">Email :</label>
    <input type="email" id="email"name="user mail" placeholder="Email" required>
    <br> <br>
    <label for="pass">Password:</label>
    <input type="password" id="pass" name="password" placeholder="Password" required>
    <br> <br>
    <label for="phone">Phone No:</label>
    <br>
    <select name="code">
        <option value="+880">+880</option>
        <option value="+001">+001</option>
        <option value="+221">+221</option>
        <option value="+123">+123</option>
        <option value="+991">+991</option>
    </select>
    <input type="number" id="phone" name="phn" placeholder="123456789" required>
    <br> <br>
    <label for="country">Country</label>
    <input list="con">
    <datalist id="con">
        <option value="Bangladesh"></option>
        <option value="India"></option>
        <option value="Canada"></option>
        <option value="Srilanka"></option>
    </datalist>
    <br> <br>
    Gender:
    <input type="radio" id="gnd" name="Gender">
    <label for="gnd">male</label>
    <input type="radio" id="gnd1" name="Gender">
    <label for="gnd1">female</label>
    <input type="radio" id="gnd2" name="Gender">
    <label for="gnd2">custom</label>
    <br><br>
    <label for="date">Date of Birth:</label>
    <input type="date" id="date" name="dob">
    <br> <br>
    <label for="time">Time:</label>
    <input type="time" id="time" name="tm">
    <br><br>
    <label for="color">Color:</label>
    <input type="color" id="color" name="clr">
    <br> <br>
    <label for="file"> Choose Your photo:</label>
    <input type="file" id="file" name="fl">
    <br> <br>
    <input type="checkbox" id="vehicle1" name="vh1">
    <label for="vehicle1">I have a bike</label>
    <input type="checkbox" id="vehicle2" name="vh2">
    <label for="vehicle2">I have a bicycle</label>
    <br> <br>
    
    <textarea name="cmnt" rows="20" cols="50">Comment Here</textarea>
    <br> <br>
    <input type="submit" value="send">
    <input type="reset" value="reset">

    
    </form>
</body>
</html>
